name: Build TWRP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP for Infinix X689C
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync TWRP Source (AOSP 11)
        run: |
          export PATH=~/bin:$PATH
          mkdir workspace
          cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copy Device Tree
        run: |
          mkdir -p workspace/device/infinix/X689C
          rsync -av --exclude='workspace' ./ workspace/device/infinix/X689C/

      - name: Compile TWRP
        run: |
          export PATH=~/bin:$PATH
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_X689C-eng
          mka bootimage

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Infinix-X689C
          path: workspace/out/target/product/X689C/boot.img
